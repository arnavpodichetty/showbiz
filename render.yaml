services:
  - type: web
    name: setlist-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # No SETLISTFM_API_KEY on purpose: visitors use their own free key.
